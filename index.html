// app/hooks/useColumnTypes.js
// T023 — Hook returning the column list with inferred types from a Dataset

var _React = React,
  useMemo = _React.useMemo;

/**
 * useColumnTypes — derive the column list from a Dataset.
 *
 * @param {Dataset|null} dataset
 * @returns {{ columns: Array<Column> }}
 */
function useColumnTypes(dataset) {
  var columns = useMemo(function () {
    if (!dataset || !Array.isArray(dataset.columns)) return [];
    return dataset.columns;
  }, [dataset]);
  return {
    columns: columns
  };
}

@keyframes trae-spin {
  to {
    transform: rotate(360deg);
  }
}

@keyframes trae-edit-bar-enter {
  from {
    opacity: 0;
    transform: translateY(-4px) scale(0.98);
  }

  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

@keyframes trae-edit-bar-leave {
  from {
    opacity: 1;
    transform: translateY(0) scale(1);
  }

  to {
    opacity: 0;
    transform: translateY(-4px) scale(0.98);
  }
}

@keyframes trae-edit-panel-leave {
  from {
    opacity: 1;
    transform: translateY(0) scale(1);
  }

  to {
    opacity: 0;
    transform: translateY(-4px) scale(0.98);
  }
}

.trae-edit-mode-active:not(.trae-edit-mode-dragging) body *:not([data-trae-edit-ui]):not([data-trae-edit-ui] *) {
  transition: none !important;

}

.trae-edit-mode-reorder-hit-test [data-trae-edit-ui]:not(.trae-edit-pointer-shield):not(.trae-edit-panel),
.trae-edit-mode-reorder-hit-test [data-trae-edit-ui]:not(.trae-edit-pointer-shield):not(.trae-edit-panel) * {

}

.trae-browser-inspect-overlay {
  position: fixed;
  top: 0;

}

.trae-browser-inspect-highlight-box {

  left: 0;
  z-index: var(--trae-layer-browser-inspect-highlight);
  display: none;
}

.trae-browser-inspect-highlight-tag {
  position: absolute;
  left: 0px;
  top: 0px;
  height: 18px;
  padding: 0 6px;

  border-radius: 4px;
  background-color: var(--trae-status-success-default);
  color: var(--trae-text-onaccent);

  font-weight: 400;
  display: none;
  align-items: center;

}

.trae-browser-inspect-highlight-box-show {

}

.trae-browser-inspect-highlight-tag.trae-browser-inspect-highlight-box-show {

}

.trae-browser-inspect-select-button.trae-browser-inspect-highlight-box-show {

}

.trae-browser-inspect-select-button {

  top: 0;
  left: 0;

}

.trae-browser-inspect-select-highlight-box {

}

.trae-browser-inspect-select-highlight-box .trae-browser-inspect-highlight-tag {

.trae-add-to-chat-content {

.trae-fade-enter {

.trae-comment-input {

.trae-point-edit-bar,

.trae-comment-only-panel {

}

.trae-edit-panel:not(.trae-edit-panel-leave) {
  pointer-events: auto !important;
}

.trae-edit-bar-enter {
  animation: trae-edit-bar-enter var(--transition-normal, 0.18s cubic-bezier(0.2, 0, 0, 1)) both;
}

.trae-edit-bar-leave {
  pointer-events: none;
  animation: trae-edit-bar-leave var(--transition-fast, 0.14s ease) both;
}

.trae-edit-panel-leave {
  pointer-events: none;
  animation: trae-edit-panel-leave var(--transition-fast, 0.14s ease) both;
}

.trae-edit-panel [data-trae-tooltip] {
  position: relative;
}

.trae-edit-panel [data-trae-tooltip]::after {
  content: attr(data-trae-tooltip);
  position: absolute;
  left: 50%;
  bottom: calc(100% + 8px);
  z-index: var(--trae-layer-edit-tooltip);
  padding: 6px 10px;
  border-radius: 6px;
  background: var(--trae-bg-invert, var(--bg-bg-invert));
  color: var(--trae-text-onaccent, var(--text-text-onaccent));
  box-shadow: var(--trae-floating-shadow);
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'PingFang SC', sans-serif;
  font-size: 11px;
  font-weight: 500;
  line-height: 16px;
  letter-spacing: 0.039px;
  white-space: nowrap;
  pointer-events: none;
  box-sizing: border-box;
  opacity: 0;
  transform: translateX(-50%);
  visibility: hidden;
}

.trae-edit-panel [data-trae-tooltip]::before {
  content: '';
  position: absolute;
  left: 50%;
  bottom: calc(100% + 5px);
  z-index: var(--trae-layer-edit-tooltip);
  width: 8px;
  height: 4px;
  background: var(--trae-bg-invert, var(--bg-bg-invert));
  clip-path: polygon(0 0, 100% 0, 50% 100%);
  transform: translateX(-50%);
  pointer-events: none;
  opacity: 0;
  visibility: hidden;
}

.trae-edit-panel [data-trae-tooltip]:hover::after,
.trae-edit-panel [data-trae-tooltip]:focus-visible::after,
.trae-edit-panel [data-trae-tooltip]:hover::before,
.trae-edit-panel [data-trae-tooltip]:focus-visible::before {
  opacity: 1;
  visibility: visible;
}
